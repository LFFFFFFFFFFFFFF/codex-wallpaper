name: Wallpaper submission / 作品投稿
description: Submit a wallpaper published from the player, or paste its submission data.
title: '[作品投稿] '
body:
  - type: markdown
    attributes:
      value: |
        推荐直接在播放器「创意工坊 → 本机作品 → 发布到社区」投稿。
        本入口用于手工提交同格式的投稿数据。仅上传你有权分发的素材，勿上传他人的WE作品。
        维护者检查权利与画面后添加 workshop-approved 标签；程序再验证包和哈希并加入目录。
  - type: textarea
    id: submission
    attributes:
      label: 投稿数据
      description: Include the codex-wallpaper-submission:v1 marker and fenced JSON generated by the publishing tool.
    validations:
      required: true
